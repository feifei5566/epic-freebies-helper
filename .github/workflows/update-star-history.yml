name: Update Star History

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: update-star-history
  cancel-in-progress: true

jobs:
  update:
    if: github.repository == 'Ronchy2000/epic-freebies-helper'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate star history charts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/generate_star_history.py \
            --repository "${{ github.repository }}" \
            --output-light docs/images/star-history-light.svg \
            --output-dark docs/images/star-history-dark.svg

      - name: Commit updated charts
        run: |
          if git diff --quiet -- docs/images/star-history-light.svg docs/images/star-history-dark.svg; then
            echo "Star history is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/star-history-light.svg docs/images/star-history-dark.svg
          git commit -m "chore: update star history chart"
          git push
